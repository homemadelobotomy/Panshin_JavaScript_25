
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотохостинг</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="bg-light py-3">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="m-0">Фотохостинг</h1>
                <a href="#" class="btn btn-primary">Домой</a>
            </div>
        </div>
    </header>

    <div class="container my-4">
        <div class="row g-3 align-items-center">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Поиск...">
                    <button class="btn btn-outline-secondary" type="button">Найти</button>
                </div>
            </div>
            
            <div class="col-md-3">
                <select class="form-select">
                    <option selected>Все категории</option>
                    <option>Категория 1</option>
                    <option>Категория 2</option>
                    <option>Категория 3</option>
                </select>
            </div>
            
            <div class="col-md-3">
                <div class="d-flex gap-2">
                    <button class="btn btn-danger flex-grow-1">Удалить</button>
                    <button class="btn btn-success flex-grow-1">Добавить</button>
                </div>
            </div>
        </div>
    </div>

    <main class="container my-4">
        <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
            <div class="col">
                <div class="card h-100">
                    <img src="https://via.placeholder.com/300" class="card-img-top" alt="Товар">
                    <div class="card-body">
                        <h5 class="card-title">Название товара</h5>
                        <p class="card-text">Описание товара или его характеристики.</p>
                    </div>
                    <div class="card-footer bg-transparent">
                        <button class="btn btn-sm btn-outline-primary">Подробнее</button>
                    </div>
                </div>
            </div>
            
           
            <div class="col">
                <div class="card h-100">
                    <img src="https://via.placeholder.com/300" class="card-img-top" alt="Товар">
                    <div class="card-body">
                        <h5 class="card-title">Другой товар</h5>
                        <p class="card-text">Еще одно описание товара.</p>
                    </div>
                    <div class="card-footer bg-transparent">
                        <button class="btn btn-sm btn-outline-primary">Подробнее</button>
                    </div>
                </div>
            </div>
            
           
        </div>
    </main>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
